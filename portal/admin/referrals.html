<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Referrals — Impactus Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy:#101a2d; --amber:#f5b731; --amber-d:#c78d0a; --ink:#1c2333; --mut:#6b7486; --bg:#f6f7fa; --card:#ffffff; --green:#1a9a5c; --red:#c93b3b; --line:#e6e9f0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  .wrap { max-width:1080px; margin:0 auto; padding:16px; }
  header { background:var(--navy); color:#fff; position:sticky; top:0; z-index:5; }
  header .wrap { display:flex; align-items:center; justify-content:space-between; padding-top:12px; padding-bottom:12px; gap:10px; flex-wrap:wrap; }
  .logo { display:flex; align-items:center; }
  nav.tabs { display:flex; gap:4px; }
  .tab { color:#fff; opacity:.75; padding:6px 12px; border-radius:8px; font-size:13px; text-decoration:none; font-weight:600; }
  .tab:hover { opacity:1; }
  .tab.active { background:rgba(255,255,255,.12); opacity:1; color:var(--amber); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:16px; }
  h1 { font-size:20px; font-weight:800; }
  h2 { font-size:15px; font-weight:700; margin-bottom:10px; }
  .muted { color:var(--mut); font-size:13px; }
  .hidden { display:none !important; }
  .btn { display:inline-block; padding:8px 15px; background:var(--amber); color:var(--navy); border:none; border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn.ghost { background:#fff; border:1px solid var(--line); color:var(--ink); }
  .btn.sm { padding:6px 11px; font-size:12.5px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:16px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .kpi .v { font-size:21px; font-weight:800; } .kpi .l { font-size:11.5px; color:var(--mut); margin-top:2px; }
  .kpi .sub { font-size:11.5px; color:var(--green); margin-top:2px; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--mut); padding:8px 8px 6px 0; border-bottom:1px solid var(--line); white-space:nowrap; }
  th.sortable { cursor:pointer; user-select:none; }
  th.sortable:hover { color:var(--ink); }
  th .arr { color:var(--amber-d); margin-left:2px; }
  td { padding:9px 8px 9px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  footer { text-align:center; padding:26px 0 34px; }
</style>
</head>
<body>

<header><div class="wrap">
  <div class="logo"><img src="https://events.impactuslearning.com/images/white-logo.png" alt="Impactus Learning" style="height:24px;vertical-align:middle"><span style="color:#fff;font-weight:600;font-size:14px;opacity:.8;margin-left:10px">Admin</span></div>
  <nav class="tabs">
    <a class="tab" href="./" target="_blank">Dashboard</a>
    <a class="tab" href="students.html" target="_blank">Students</a>
    <a class="tab" href="earnings.html" target="_blank">Earnings</a>
    <a class="tab active" href="referrals.html">Referrals</a>
  </nav>
  <button class="btn ghost sm hidden" id="signout" style="background:none;border:1px solid rgba(255,255,255,.3);color:#fff">Sign out</button>
</div></header>

<div class="wrap">

  <div id="view-login" class="card hidden" style="max-width:460px;margin:40px auto">
    <h1>Sign in required</h1>
    <p class="muted" style="margin-top:6px">Please sign in from the <a href="./" target="_blank">admin dashboard</a> first, then refresh this page.</p>
    <button class="btn ghost" style="margin-top:14px" onclick="location.reload()">Refresh</button>
  </div>

  <div id="view-noauth" class="card hidden" style="max-width:420px;margin:40px auto">
    <h1>Not authorized</h1>
    <button class="btn ghost" id="noauth-out" style="margin-top:14px">Sign out</button>
  </div>

  <div id="view-app" class="hidden">

    <div class="kpis" id="kpis"></div>

    <div class="card">
      <h2>Referral leaderboard</h2>
      <div id="refboard" class="muted">Loading…</div>
    </div>

  </div>
</div>

<footer class="muted">Impactus Learning Pte Ltd · Admin console</footer>

<script>
const SUPABASE_URL = 'https://tdbzxhdlwnchbnxhmpjf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hTMNVquQ7GQJubuGzL-4Bg_AXqqbRKw';
const ADMIN_EMAIL = 'andrew@impactuslearning.com';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: 'implicit', detectSessionInUrl: true } });

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function show(id) { ['view-login','view-app','view-noauth'].forEach(v => $(v).classList.toggle('hidden', v !== id)); }

let students = [], bookings = [], byStudent = {};

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  route(session);
  sb.auth.onAuthStateChange((ev, s) => { if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') route(s); });
}
function route(session) {
  if (!session) { show('view-login'); return; }
  if ((session.user.email || '').toLowerCase() !== ADMIN_EMAIL) { show('view-noauth'); return; }
  $('signout').classList.remove('hidden');
  show('view-app');
  loadAll();
}
$('signout').onclick = () => sb.auth.signOut();
$('noauth-out').onclick = () => sb.auth.signOut();

async function loadAll() {
  const [s, b] = await Promise.all([
    sb.from('students').select('*'),
    sb.from('bookings').select('*'),
  ]);
  students = s.data || []; bookings = b.data || [];
  byStudent = Object.fromEntries(students.map(x => [x.id, x]));
  renderKPIs(); renderRefBoard();
}

function renderKPIs() {
  const mo = new Date().toISOString().slice(0, 7);
  const referred = students.filter(s => s.referred_by);
  const refMo = referred.filter(s => (s.created_at || '').slice(0, 7) === mo).length;
  const referrers = new Set(referred.map(s => s.referred_by).filter(id => byStudent[id])).size;
  const cash = referred.reduce((t, s) => t + bookings
    .filter(b => b.student_id === s.id && b.status === 'confirmed')
    .reduce((n, b) => n + Number(b.cash_paid_sgd || 0), 0), 0);
  const converted = referred.filter(s => bookings.some(b => b.student_id === s.id && b.status === 'confirmed' && Number(b.cash_paid_sgd || 0) > 0)).length;
  $('kpis').innerHTML = `
    <div class="kpi"><div class="v">${referred.length}</div><div class="l">Students who came via a referral</div><div class="sub">+${refMo} this month</div></div>
    <div class="kpi"><div class="v">${referrers}</div><div class="l">Students who have referred someone</div></div>
    <div class="kpi"><div class="v">${converted}</div><div class="l">Referred students who paid for a class</div></div>
    <div class="kpi"><div class="v">S$${cash.toLocaleString('en-SG', { maximumFractionDigits: 0 })}</div><div class="l">Cash brought in by referrals</div></div>`;
}

// ---------- Referral leaderboard ----------

// Referrals earn NO points automatically — this board exists so Andrew can see who is
// actually bringing people in, and thank them by hand (🎁 button on the Students tab).
// Click any heading to re-sort. Numbers start high→low (the interesting end first);
// text starts A–Z. Cash is the default because that's the "who to thank" order.
let sortKey = 'cash', sortDir = -1;
const SORTVAL = {
  referrer: (r) => (r.s.name || r.s.email || '').toLowerCase(),
  code:     (r) => (r.s.referral_code || '').toLowerCase(),
  signups:  (r) => r.signups,
  converted:(r) => r.converted,
  cash:     (r) => r.cash,
};
const NUMERIC = new Set(['signups', 'converted', 'cash']);
window.setSort = function (k) {
  if (sortKey === k) sortDir = -sortDir;
  else { sortKey = k; sortDir = NUMERIC.has(k) ? -1 : 1; }
  renderRefBoard();
};

function renderRefBoard() {
  const referrers = {};
  students.filter(s => s.referred_by).forEach(s => {
    const r = referrers[s.referred_by] = referrers[s.referred_by] || { signups: 0, converted: 0, cash: 0 };
    r.signups++;
    const paid = bookings.filter(b => b.student_id === s.id && b.status === 'confirmed')
      .reduce((t, b) => t + Number(b.cash_paid_sgd || 0), 0);
    if (paid > 0) r.converted++;
    r.cash += paid;
  });
  const rows = Object.keys(referrers).map(id => ({ s: byStudent[id], ...referrers[id] })).filter(r => r.s);
  rows.sort((a, b) => {
    const va = SORTVAL[sortKey](a), vb = SORTVAL[sortKey](b);
    const c = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb));
    return c !== 0 ? c * sortDir : b.cash - a.cash || b.signups - a.signups;   // stable tie-break
  });
  if (!rows.length) { $('refboard').textContent = 'No referrals yet.'; return; }
  const th = (k, label) => `<th class="sortable" onclick="setSort('${k}')">${label}${sortKey === k ? `<span class="arr">${sortDir === 1 ? '▲' : '▼'}</span>` : ''}</th>`;
  $('refboard').innerHTML = `<p class="muted" style="margin-top:-6px;margin-bottom:10px">No points are awarded for referrals — use the 🎁 button on the Students tab to thank someone. Click any column heading to sort.</p>
    <table><thead><tr>${th('referrer', 'Referrer')}${th('code', 'Code')}${th('signups', 'Sign-ups')}${th('converted', 'Paid for a class')}${th('cash', 'Cash they brought in')}</tr></thead><tbody>` +
    rows.map(r => `<tr><td><strong>${esc(r.s.name)}</strong><br><span class="muted">${esc(r.s.email)}</span></td>
      <td>${esc(r.s.referral_code)}</td><td>${r.signups}</td><td>${r.converted}</td>
      <td style="color:var(--green);font-weight:700">${r.cash ? 'S$' + r.cash.toFixed(0) : '—'}</td></tr>`).join('') + '</tbody></table>';
}

init();
</script>
</body>
</html>
